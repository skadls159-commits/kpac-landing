<style>
.bk{max-width:640px;margin:0 auto}
.bk .lform{padding:30px 28px 26px}
.bk-sec{margin-top:24px}
.bk-sec>label,.bk-lbl{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.bk-days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bk-day{border:1px solid var(--line-2);border-radius:8px;background:#fff;padding:10px 0 11px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .2s,background .2s}
.bk-day small{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.bk-day b{display:block;font-size:19px;letter-spacing:-.02em;margin-top:1px}
.bk-day:hover{border-color:var(--ink-4)}
.bk-day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.bk-day[aria-pressed="true"] b,.bk-day[aria-pressed="true"] small{color:var(--accent)}
.bk-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bk-slot{height:48px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font:inherit;font-size:15px;font-weight:600;color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums;transition:border-color .2s,background .2s}
.bk-slot:hover:not(:disabled){border-color:var(--ink-4)}
.bk-slot:disabled{background:var(--bg-2);border-color:var(--line);color:var(--ink-4);cursor:not-allowed}
.bk-slot:disabled span{display:block;font-size:11px;font-weight:500;margin-top:-2px}
.bk-slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.bk-grp{font-size:12.5px;color:var(--ink-4);font-weight:600;margin:12px 0 8px}
.bk-grp:first-of-type{margin-top:0}
.bk-who{display:flex;gap:10px;align-items:center;background:var(--bg-2);border-radius:8px;padding:12px 14px;margin-top:18px;font-size:14px;color:var(--ink-2)}
.bk-who b{color:var(--navy)}
.bk-who[hidden]{display:none}
.bk-pick{margin-top:22px;font-size:14px;color:var(--ink-3)}
.bk-pick b{color:var(--ink)}
.bk .btn-primary{width:100%;height:54px;margin-top:12px;font-size:16px}
.bk .btn-primary:disabled{background:var(--line-2);cursor:not-allowed}
.bk-done{display:none;text-align:left}
.bk-done .ic{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.bk-done h2{font-size:24px;letter-spacing:-.035em}
.bk-done>p{margin-top:6px;color:var(--ink-3);font-size:14.5px}
.bk-rows{margin-top:20px;border-top:1px solid var(--line)}
.bk-rows div{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.bk-rows span{color:var(--ink-3)}
.bk.ok .bk-form{display:none}.bk.ok .bk-done{display:block}
.bk .lf-grid{margin-top:18px}
@media(max-width:560px){.bk .lform{padding:24px 18px 22px}.bk .lf-grid{grid-template-columns:1fr}.bk-day b{font-size:17px}}

<body class="v2">

<div class="v2hero"><h1>정책자금 가능 여부,<br>전화로 바로 확인해 드려요</h1><p>대표자명 · 연락처 · 통화 시간만 남겨 주세요.</p></div>
<section class="section"><div class="wrap">
<div class="bk" id="bk">
 <div class="lform">
  <div class="bk-form">
   <h2>통화 예약하기</h2><p>편한 날짜와 시간을 고르시면 담당 컨설턴트가 그 시간에 직접 전화드립니다. (상담 무료)</p>
   <div class="bk-who" id="bkWho" hidden></div>
   <div class="lf-grid" id="bkInfo">
    <div><label for="b_name">대표자명 <em>*</em></label><input id="b_name" autocomplete="name"></div>
    <div><label for="b_phone">연락처 <em>*</em></label><input id="b_phone" type="tel" inputmode="numeric" placeholder="010-0000-0000" autocomplete="tel"></div>
   </div>
   <div class="bk-sec"><span class="bk-lbl">날짜</span><div class="bk-days" id="bkDays"></div></div>
   <div class="bk-sec"><span class="bk-lbl">시간</span><div class="bk-grp">오전</div><div class="bk-slots" id="bkAm"></div><div class="bk-grp">오후</div><div class="bk-slots" id="bkPm"></div></div>
   <label class="agree" id="bkAgreeWrap"><input type="checkbox" id="b_agree"><span>상담을 위한 개인정보 수집 · 이용에 동의합니다. (수집항목: 성명 · 연락처 / 목적: 상담 예약 및 안내 / 보유기간: 상담 종료 후 1년) <a href="privacy.html" target="_blank">개인정보처리방침</a></span></label>
   <p class="bk-pick" id="bkPick">날짜와 시간을 선택해 주세요</p>
   <button type="button" class="btn btn-primary" id="bkGo" disabled>예약하기</button>
   <div class="lf-msg" id="bkMsg" role="status"></div>
  </div>
  <div class="bk-done">
   <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
   <h2>예약이 확정되었습니다</h2><p>카카오톡으로 예약 확정 안내를 보내드렸습니다.</p>
   <div class="bk-rows"><div><span>상담 일시</span><b id="bkWhen"></b></div><div><span>진행 방식</span><b>전화 상담</b></div><div><span>연락 번호</span><b>배정된 컨설턴트가 직접 연락</b></div></div>
   <p style="margin-top:16px;font-size:14px;color:var(--ink-3)">상담 전날 카카오톡으로 한 번 더 안내드립니다.</p>
  </div>
 </div>
</div>
</div></section>
<div class="v2foot">한국정책자문센터 KPAC · 상담 무료 · <a href="privacy.html" target="_blank">개인정보처리방침</a></div>
<script>
(function(){
  var API='https://kpac-crm-server-production.up.railway.app';
  var W=['일','월','화','수','목','금','토'];
  var q=new URLSearchParams(location.search), K='', SRC='web'; /* r174a: 광고 랜딩은 알림톡 링크(k) 안 씀 */
  var S=null, sel=0, pick=null, known=false, busy=false;
  var $=function(id){return document.getElementById(id);};
  /* r174a: 광고 추적값 저장 (첫/마지막 클릭 30일) — 주소창은 지우지 않음 */
  var KEYS=['src','ad','adg','utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','gbraid','wbraid','fbclid','ttclid'];
  var AP=new URLSearchParams(location.search), cur={}, hasAd=false;
  KEYS.forEach(function(k){var v=AP.get(k); if(v){cur[k]=String(v).slice(0,200); hasAd=true;}});
  cur.ref=(document.referrer||'').slice(0,200); cur.url=location.href.split('#')[0].slice(0,600); cur.t=Date.now();
  var LK='kpac_attr_last_v1', TTL=30*86400000, stored=null;
  try{var o=JSON.parse(localStorage.getItem(LK)||'null'); if(o&&Date.now()-(o.t||0)<TTL) stored=o;}catch(e){}
  if(hasAd){try{localStorage.setItem(LK,JSON.stringify(cur));}catch(e){} try{sessionStorage.setItem(LK,JSON.stringify(cur));}catch(e){}}
  var A=hasAd?cur:(stored||cur), TEST=AP.get('test')==='1';
  function adFields(){return {src:A.src||A.utm_source||(A.gclid||A.gbraid||A.wbraid?'google_ads':''), ad:A.ad||A.utm_content||'', utm_source:A.utm_source||'', utm_medium:A.utm_medium||'', utm_campaign:A.utm_campaign||'', utm_term:A.utm_term||'', utm_content:A.utm_content||'', gclid:A.gclid||A.gbraid||A.wbraid||'', fbclid:A.fbclid||'', ttclid:A.ttclid||'', referrer:(A.ref||'').slice(0,200), landing:(A.url||location.href).slice(0,480)};}
  function conv(){
    try{if(typeof gtag==='function'){gtag('event','conversion',{'send_to':'AW-18048988442/iDYiCNiihN4cEJrqtp5D','value':1.0,'currency':'KRW'}); var F=adFields(); gtag('event','generate_lead',{send_to:'G-WCTPRG3HYE',currency:'KRW',value:1,lead_channel:String(F.src||''),lead_ad:String(F.ad||'')});}}catch(x){}
    try{if(typeof fbq==='function') fbq('track','Lead');}catch(x){}
    try{if(window.karrotPixel) window.karrotPixel.track('CompleteRegistration');}catch(x){}
  }
  function intake(body){ /* r174a: 광고 출처를 먼저 CRM에 남김 → 예약은 같은 번호라 출처 그대로 */
    var F=adFields(), p={name:body.name, phone:body.phone, page:'kpac-landing 예약화면 v2'};
    for(var k in F){ if(F[k]) p[k]=F[k]; }
    if(TEST) p.test=true;
    return fetch(API+'/api/intake',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(p)}).then(function(r){return r.json();}).catch(function(){return null;});
  }

  function rnd(s){var x=Math.sin(s)*10000;return x-Math.floor(x);}
  function dObj(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  function fmt(h){return (h<12?'오전 ':'오후 ')+(h>12?h-12:h)+'시';}
  function label(i,h){var d=dObj(S.days[i]);return (d.getMonth()+1)+'월 '+d.getDate()+'일('+W[d.getDay()]+') '+fmt(h);}
  function blocked(i){ /* r174c: 대표 규칙(10/19) 예약 무제한 · 가짜 마감 표시 안 함 → 못 받는 시간(매일 닫는 시간·지난 시간·서버가 거절한 시간)은 아예 안 보여요 */
    var day=S.days[i], b=(S.fake||[]).slice(), bad=BAD[day]||[];
    S.hours.forEach(function(h){ if((i===0&&h<=S.nowHour)||bad.indexOf(h)>=0){ if(b.indexOf(h)<0)b.push(h); } });
    return b;
  }
  function avail(i){var bl=blocked(i);return S.hours.filter(function(h){return bl.indexOf(h)<0});}
  var BAD={};
  function msg(t){var m=$('bkMsg');m.className='lf-msg'+(t?' show err':'');m.textContent=t||'';}
  function draw(){
    if(!S)return;
    if(!avail(sel).length){for(var k=0;k<S.days.length;k++){if(avail(k).length){sel=k;pick=null;break;}}}
    $('bkDays').innerHTML=S.days.map(function(s,i){if(!avail(i).length)return '';var d=dObj(s);return '<button type="button" class="bk-day" aria-pressed="'+(i===sel)+'" data-i="'+i+'"><small>'+(i===0?'오늘':W[d.getDay()])+'</small><b>'+d.getDate()+'</b></button>'}).join('');
    var ok=avail(sel);
    if(pick&&ok.indexOf(pick)<0)pick=null;
    function cell(h){return '<button type="button" class="bk-slot" data-h="'+h+'" aria-pressed="'+(h===pick)+'">'+(h>12?h-12:h)+':00</button>'}
    var am=ok.filter(function(h){return h<12}), pm=ok.filter(function(h){return h>12});
    $('bkAm').innerHTML=am.map(cell).join(''); $('bkPm').innerHTML=pm.map(cell).join('');
    var g=document.querySelectorAll('#bk .bk-grp'); if(g[0])g[0].style.display=am.length?'':'none'; if(g[1])g[1].style.display=pm.length?'':'none';
    $('bkAm').style.display=am.length?'':'none'; $('bkPm').style.display=pm.length?'':'none';
    var go=$('bkGo'),p=$('bkPick');
    if(pick){p.innerHTML='선택한 시간 <b>'+label(sel,pick)+'</b>';go.disabled=false;}else{p.textContent='날짜와 시간을 선택해 주세요';go.disabled=true;}
  }
  function load(cb){
    fetch(API+'/api/book/slots'+(K?'?k='+encodeURIComponent(K):''),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      S=j;
      if(j.who&&j.who.name&&!known){known=true;$('bkTitle').innerHTML=j.who.name+' 대표님,<br>통화 편한 시간을 골라주세요';var w=$('bkWho');w.hidden=false;w.innerHTML=j.who.fund?'확인 요청 자금 <b>'+j.who.fund+'</b>':'<b>'+j.who.name+'</b> 대표님 예약';$('bkInfo').style.display='none';$('bkAgreeWrap').style.display='none';}
      if(j.stop)msg('지금은 상담 예약을 잠시 받지 않아요. 1866-1912로 연락 주시면 바로 도와드릴게요.');
      if(!avail(sel).length){for(var k2=0;k2<S.days.length;k2++){if(avail(k2).length){sel=k2;break;}}}
      draw(); if(cb)cb();
    }).catch(function(){msg('예약 정보를 불러오지 못했어요. 잠시 후 다시 시도하시거나 1866-1912로 연락 주세요.');});
  }
  $('bk').addEventListener('click',function(e){var t=e.target.closest('.bk-day,.bk-slot');if(!t||t.disabled)return;if(t.dataset.i!=null){sel=+t.dataset.i;pick=null;}else{pick=+t.dataset.h;}msg('');draw();});
  var bp=$('b_phone');bp.addEventListener('input',function(e){var v=e.target.value.replace(/\D/g,'').slice(0,11);if(v.length>7)v=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7);else if(v.length>3)v=v.slice(0,3)+'-'+v.slice(3);e.target.value=v;});
  $('bkGo').addEventListener('click',function(){
    if(busy||!pick)return;
    var body={k:K,src:SRC,day:S.days[sel],hour:pick};
    if(!known){
      body.name=$('b_name').value.trim(); body.phone=$('b_phone').value.trim(); body.agree=$('b_agree').checked;
      if(!body.name){msg('대표자명을 입력해 주세요.');return;}
      if(body.phone.replace(/\D/g,'').length<10){msg('연락처를 정확히 입력해 주세요.');return;}
      if(!body.agree){msg('개인정보 수집 · 이용에 동의해 주세요.');return;}
    }
    busy=true; var go=$('bkGo'); go.disabled=true; go.textContent='예약 중…'; if(TEST) body.test=true;
    (known?Promise.resolve(null):intake(body)).then(function(){ return fetch(API+'/api/book',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){return {s:r.status,j:j}})}).then(function(x){
      busy=false; go.textContent='예약하기';
      if(x.s===200&&x.j.ok){conv();$('bkWhen').textContent=x.j.when;$('bk').classList.add('ok');window.scrollTo({top:$('bk').getBoundingClientRect().top+window.scrollY-120,behavior:'smooth'});return;}
      if(x.s===400&&/선택할 수 없는|지난 시간/.test(x.j.error||'')){var dd=body.day;(BAD[dd]=BAD[dd]||[]).push(body.hour);msg('그 시간은 상담이 어려워요. 다른 시간을 골라 주세요.');}else msg(x.j.error||'예약에 실패했어요. 1866-1912로 연락 주세요.'); pick=null; load();
    }); }).catch(function(){busy=false;go.textContent='예약하기';msg('연결이 원활하지 않아요. 잠시 후 다시 시도해 주세요.');draw();});
  });
  load();
})();
</script>
